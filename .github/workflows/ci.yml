name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      # dist/ is committed, so test:all rebuilds before the tests that import it.
      # test:all is deliberately the offline subset: measure/attribute read the
      # install database and ~/.config/opencode, neither of which exists here.
      - run: npm run test:all
      - name: CLI smoke test
        run: |
          node bin/oc-harness.mjs list
          node bin/oc-harness.mjs show space-bunny-free
          node bin/oc-harness.mjs use space-bunny-free --print | tail -20
          node bin/oc-harness.mjs use longcat-2.5-preview-free --print | grep -q '"variant"'
      - name: install and verify into a scratch config dir
        run: |
          export OPENCODE_CONFIG_DIR="$RUNNER_TEMP/opencode-config"
          node bin/oc-harness.mjs use space-bunny-free --yes
          node bin/oc-harness.mjs install
          node bin/oc-harness.mjs verify
          node bin/oc-harness.mjs agents
          # Reuses the same scratch config dir, so the config-drift check inside
          # doctor reads the config installed above instead of the runner's.
          node bin/oc-harness.mjs doctor

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
